name: Gloria AI Visibility Core CI

on:
  push:
    branches: [gloria-ai-visibility-core]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck + IZI Acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.16.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: node --check scripts/run-visibility-prompt-set.mjs
      - run: node --check scripts/compare-visibility-runs.mjs
      - run: node -e "JSON.parse(require('node:fs').readFileSync('config/visibility/gloria-live-acceptance-v1.json','utf8')); JSON.parse(require('node:fs').readFileSync('config/visibility/gloria-baseline-v1.json','utf8'))"
      - run: node scripts/izi-ai-visibility-static-acceptance.mjs
