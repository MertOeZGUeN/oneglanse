name: Gloria AI Visibility Core CI

on:
  push:
    branches: [gloria-ai-visibility-core]
  pull_request:
    branches: [main]

jobs:
  typecheck:
    name: Typecheck + IZI Acceptance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: '10.16.0'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm turbo build --filter=@oneglanse/services...
      - run: node scripts/izi-ai-visibility-deterministic-smoke.mjs
      - run: node --check scripts/visibility-preflight.mjs
      - run: node --check scripts/visibility-auth.mjs
      - run: node --check scripts/run-visibility-local.mjs
      - run: node --check scripts/compare-visibility-local.mjs
      - run: node --check scripts/run-visibility-prompt-set.mjs
      - run: node --check scripts/compare-visibility-runs.mjs
      - run: node -e "const fs=require('node:fs'); ['config/visibility/gloria-live-acceptance-v1.json','config/visibility/gloria-baseline-v1.json','config/visibility/gloria-profile-v1.json'].forEach(p=>JSON.parse(fs.readFileSync(p,'utf8')))"
      - run: node scripts/izi-ai-visibility-static-acceptance.mjs
